[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchrag"
version = "1.0.0"
description = "Research paper understanding, evidence-driven retrieval, and implementation reproduction platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Research RAG" }]

dependencies = [
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # Configuration & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Document parsing (default backend: PyMuPDF, no torch required)
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    # Dense embeddings (ONNX Runtime backend, no torch required)
    "fastembed>=0.8.0",
    # Dense vector store (embedded/local mode)
    "qdrant-client>=1.12",
    # Token counting
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# High-fidelity parsing backend (pulls in torch + deep models).
# Install with: pip install "researchrag[docling]"
docling = ["docling>=2.0"]
# Anthropic provider (uses httpx, no extra dependency required;
# listed for documentation purposes only).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
researchrag = "researchrag.cli:main"

[tool.setuptools.packages.find]
include = ["researchrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download models or run full ingestion (deselect with -m 'not slow')",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
